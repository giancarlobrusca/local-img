[package]
name = "local-img-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Local text-to-image generation, without a clone"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls and no async runtime. The shell's downloads happen
# on plain std threads, so a futures stack would buy nothing.
ureq = "3"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
fs4 = "1"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
