name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 only, deliberately. On an Intel Mac there is no Metal
          # backend, so every image would come off the CPU — the README
          # already calls that impractical, and shipping a binary that
          # disappoints is worse than saying so.
          - os: macos-14
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            args: ''
          # Built on 22.04, not the newest: glibc and webkit from the oldest
          # release supported.
          - os: ubuntu-22.04
            label: Linux x64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: local-img ${{ github.ref_name }}
          releaseBody: |
            Download the file for your platform below.

            **These builds are not signed.** macOS will say the app "cannot be
            opened because the developer cannot be verified" — right-click the
            app, choose Open, then Open again. Windows SmartScreen will say
            "Windows protected your PC" — click More info, then Run anyway.
          releaseDraft: true
          args: ${{ matrix.args }}
