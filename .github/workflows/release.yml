name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 only, deliberately. On an Intel Mac there is no Metal
          # backend, so every image would come off the CPU — the README
          # already calls that impractical, and shipping a binary that
          # disappoints is worse than saying so.
          - os: macos-14
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            args: ''
          # Built on 22.04, not the newest: glibc and webkit from the oldest
          # release supported.
          - os: ubuntu-22.04
            label: Linux x64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: local-img ${{ github.ref_name }}
          releaseBody: |
            Download the file for your platform below.

            **These builds are not signed.** macOS will say the app "cannot be
            opened because the developer cannot be verified" — right-click the
            app, choose Open, then Open again. Windows SmartScreen will say
            "Windows protected your PC" — click More info, then Run anyway.
          releaseDraft: true
          args: ${{ matrix.args }}

      # The landing page links to /releases/latest/download/<name>, which only
      # resolves if <name> is identical in every release. Tauri puts the
      # version in the filename, so attach a second copy under a fixed name.
      # The versioned original stays, so a release still records exactly which
      # build it is.
      - name: Attach stable-named copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          mkdir -p stable
          # artifactPaths is a JSON array. On windows-latest the paths are
          # backslash-separated, and JSON.stringify escapes each backslash,
          # so a bare grep/tr scrape leaves the escaping in place and hands
          # cp a string that is not the real path. jq parses and unescapes
          # it correctly, and ships by default on macos-14, windows-latest
          # and ubuntu-22.04 (confirmed against actions/runner-images), so
          # no extra install step is needed.
          paths="$(printf '%s' "$PATHS" | jq -r '.[]' 2>/dev/null)" || paths=""
          if [ -n "$paths" ]; then
            while IFS= read -r src; do
              case "$src" in
                *.dmg)      name=local-img-macos-arm64.dmg ;;
                *.msi)      name=local-img-windows-x64.msi ;;
                *.AppImage) name=local-img-linux-x64.AppImage ;;
                *.deb)      name=local-img-linux-x64.deb ;;
                *)          echo "skipping $src"; continue ;;
              esac
              cp "$src" "stable/$name"
              echo "$src -> $name"
            done <<< "$paths"
          fi
          # No bundle matched -- whether artifactPaths was empty/malformed
          # or the rename table has drifted from what Tauri builds -- means
          # the download links would silently 404.
          test -n "$(ls -A stable)" || { echo "no bundles matched"; exit 1; }
          gh release upload "$TAG" stable/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: publish the release
    needs: build
    # workflow_dispatch runs from a branch have no tag to publish, and should
    # keep producing a draft to inspect.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
