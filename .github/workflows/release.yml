name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 only, deliberately. On an Intel Mac there is no Metal
          # backend, so every image would come off the CPU — the README
          # already calls that impractical, and shipping a binary that
          # disappoints is worse than saying so.
          - os: macos-14
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            args: ''
          # Built on 22.04, not the newest: glibc and webkit from the oldest
          # release supported.
          - os: ubuntu-22.04
            label: Linux x64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, Tauri never runs codesign at all, and the only
          # signature the .app carries is the ad-hoc one the arm64 linker
          # leaves on the main binary by itself. That signature declares
          # sealed resources, but no Contents/_CodeSignature/ exists to back
          # it, so the bundle is *invalid* rather than merely untrusted --
          # `codesign --verify` says "code has no resources but signature
          # indicates they must be present". Gatekeeper answers an invalid
          # signature with "is damaged and can't be opened. You should move
          # it to the Trash", which has no override anywhere in the UI, so
          # the download was unusable rather than one click away.
          #
          # "-" is codesign's ad-hoc identity. It needs no certificate and no
          # Apple account, seals the bundle for real, and puts the app back
          # in the "could not verify it is free of malware" category, which
          # the user can get past from System Settings. Read only by the
          # macOS bundler, so it is inert on the Windows and Linux legs.
          #
          # Notarization is deliberately not attempted: with no APPLE_ID or
          # APPLE_API_KEY set, tauri-bundler reports MissingCredentials and
          # logs a warning rather than failing the build.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: local-img ${{ github.ref_name }}
          releaseBody: |
            Download the file for your platform below.

            **These builds are signed ad-hoc, not notarized.** macOS will say
            "Apple could not verify 'local-img' is free of malware" — click
            Done, then open System Settings → Privacy & Security, scroll to
            the message about local-img, and click Open Anyway. (Control-click
            → Open no longer works: macOS 15 removed that shortcut.) Windows
            SmartScreen will say "Windows protected your PC" — click More
            info, then Run anyway.
          releaseDraft: true
          args: ${{ matrix.args }}

      # v0.2.1 shipped a .dmg macOS called damaged, because nothing here ever
      # asked whether the bundle was signed -- the build was green and the
      # download was dead. A missing APPLE_SIGNING_IDENTITY fails exactly this
      # way again: quietly, and only on the user's machine. So assert it on
      # the runner instead. `codesign --verify` is what tells an invalid
      # signature apart from an untrusted one, and the sealed-resources line
      # is the specific thing a linker-signed binary cannot fake.
      # Checked inside the .dmg rather than in bundle/macos/, for two reasons:
      # the .dmg is what people actually download, and Tauri deletes the
      # staged .app once the .dmg is built, so a check pointed at that path
      # would fail on every release instead of only on broken ones.
      # -mountpoint avoids /Volumes/local-img, which a second concurrent
      # build -- or a developer with the release still mounted -- would
      # already be holding.
      - name: The macOS bundle has to be really signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test ${#dmgs[@]} -eq 1 || { echo "expected exactly one .dmg, found ${#dmgs[@]}"; exit 1; }
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmgs[0]}"
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/local-img.app"
          codesign -dv --verbose=2 "$mount/local-img.app" 2>&1 | tee /tmp/cs.txt
          grep -q "Sealed Resources version=" /tmp/cs.txt \
            || { echo "bundle has no sealed resources -- Gatekeeper will call this damaged"; exit 1; }

      # The landing page links to /releases/latest/download/<name>, which only
      # resolves if <name> is identical in every release. Tauri puts the
      # version in the filename, so attach a second copy under a fixed name.
      # The versioned original stays, so a release still records exactly which
      # build it is.
      - name: Attach stable-named copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          mkdir -p stable
          # artifactPaths is a JSON array. On windows-latest the paths are
          # backslash-separated, and JSON.stringify escapes each backslash,
          # so a bare grep/tr scrape leaves the escaping in place and hands
          # cp a string that is not the real path. jq parses and unescapes
          # it correctly, and ships by default on macos-14, windows-latest
          # and ubuntu-22.04 (confirmed against actions/runner-images), so
          # no extra install step is needed.
          paths="$(printf '%s' "$PATHS" | jq -r '.[]' 2>/dev/null)" || paths=""
          if [ -n "$paths" ]; then
            while IFS= read -r src; do
              case "$src" in
                *.dmg)      name=local-img-macos-arm64.dmg ;;
                *.msi)      name=local-img-windows-x64.msi ;;
                *.AppImage) name=local-img-linux-x64.AppImage ;;
                *.deb)      name=local-img-linux-x64.deb ;;
                *)          echo "skipping $src"; continue ;;
              esac
              cp "$src" "stable/$name"
              echo "$src -> $name"
            done <<< "$paths"
          fi
          # No bundle matched -- whether artifactPaths was empty/malformed
          # or the rename table has drifted from what Tauri builds -- means
          # the download links would silently 404.
          test -n "$(ls -A stable)" || { echo "no bundles matched"; exit 1; }
          gh release upload "$TAG" stable/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: publish the release
    needs: build
    # workflow_dispatch runs from a branch have no tag to publish, and should
    # keep producing a draft to inspect.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
